name: Helsingin viikko

on:
  schedule:
    # Sunnuntaisin klo 16:00 UTC, Suomessa noin klo 18 tai 19.
    - cron: "0 16 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: helsingin-viikko
  cancel-in-progress: false

jobs:
  viikko:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Hae koodi
        uses: actions/checkout@v4

      - name: Ota Python 3.12 käyttöön
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kokoa viikko
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FEEDBACK_SECRET: ${{ secrets.FEEDBACK_SECRET }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python -m src.main build

      - name: Julkaise sivu
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Ota sivu käyttöön
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Tallenna arkisto
        run: |
          git config user.name "Helsingin viikko"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "Ei uutta arkistoitavaa."
          else
            git commit -m "Viikkokooste"
            git push
          fi

      - name: Lähetä sähköposti
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FEEDBACK_SECRET: ${{ secrets.FEEDBACK_SECRET }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python -m src.main send
