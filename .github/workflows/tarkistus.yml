name: Tarkista palautteet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tarkistus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kokeile peukkua ja nollaa se
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python -m src.check_feedback
