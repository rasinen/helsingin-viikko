name: Tarkista palautteet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tarkistus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Päivitä palautteet ja kokeile peukkua
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python -m src.deploy_worker
          python -m src.check_feedback
